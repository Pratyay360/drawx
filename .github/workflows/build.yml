name: Releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
          - platform: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@main

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: nubjs/setup-nub@v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
      - run: nub install

      - name: Build Tauri and create release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v0.1.${{ github.run_number }}
          releaseName: drawx v0.1.${{ github.run_number }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}