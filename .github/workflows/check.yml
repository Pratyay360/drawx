name: Tauri PR Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jdx/mise:2026.8.16
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@main
      - name: check
        run: |
            mise deps
            mise install
