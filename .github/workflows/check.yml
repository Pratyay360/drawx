name: Tauri PR Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jdx/mise:2026.8.16
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@main

      - name: cache rust build
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-pr-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: tauri-pr-${{ runner.os }}-

      - name: install
        run: |
          mise deps
          mise install

      - name: lint and typecheck
        run: |
            mise run tauri:build
