name: Tauri PR Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/jdx/mise:2026.8.16
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@main
      - name: install system deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev

      - name: install
        run: |
          mise deps
          mise install
          nub install
          mise run tauri -- build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          bash src-tauri/scripts/patch-appimage-wayland.sh
