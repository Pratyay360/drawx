name: Tauri v2 Release Process
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "landing/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CN_APPLICATION: "pratyay/drawx"

jobs:
  draft:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main
      - name: create draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build_desktop:
    needs: draft

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: ""
          - os: macos-latest
            targets: "x86_64-apple-darwin aarch64-apple-darwin"
          - os: windows-latest
            targets: ""

    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@main
        with:
          # src-tauri/tauri.conf.json maps ../flatpak/io.github.pratyay360.drawx.metainfo.xml
          # into the deb + AppImage bundles, so the flatpak submodule must be present.
          submodules: recursive

      - uses: ./.github/actions/tauri-build
        with:
          targets: ${{ matrix.targets }}

      - name: upload assets
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  publish:
    needs: [build_desktop]

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main

      - name: publish release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }}
          api-key: ${{ secrets.CN_API_KEY }}
