name: ci
on:
  workflow_dispatch:
    inputs:
      build_ubuntu:
        description: "Build the Linux app"
        required: false
        default: true
        type: boolean
      build_windows:
        description: "Build the Windows app (2x billing multiplier)"
        required: false
        default: false
        type: boolean
      build_macos:
        description: "Build the macOS apps (10x billing multiplier)"
        required: false
        default: false
        type: boolean


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CN_APPLICATION: "pratyay/drawx"

jobs:
  draft:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main
      - name: create draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build_desktop:
    needs: draft

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            enabled: ${{ inputs.build_ubuntu }}
          - os: windows-latest
            enabled: ${{ inputs.build_windows }}
          - os: macos-latest
            enabled: ${{ inputs.build_macos }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@main

      - name: Install bun
        if: matrix.enabled
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@main
        if: matrix.enabled
        with:
          node-version: "lts/*"

      - name: Install stable toolchain
        if: matrix.enabled
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.enabled && matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            squashfs-tools

      - name: Install dependencies
        if: matrix.enabled
        run: |
          rm -f package-lock.json
          bun install

      - name: Build Tauri app for Windows and Linux
        if: matrix.enabled && matrix.os != 'macos-latest'
        run: |
          bun run tauri build
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            bash src-tauri/scripts/patch-appimage-wayland.sh
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app for macOS
        if: matrix.enabled && matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
          bun run tauri build --target x86_64-apple-darwin
          bun run tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: upload assets
        if: matrix.enabled
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}


  publish:
    needs: [build_desktop]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ubuntu }}

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main

      - name: publish release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
