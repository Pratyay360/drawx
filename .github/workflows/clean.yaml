name: Clean Workflow Runs

on:
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Number of days to keep runs (0 to delete all)"
        required: false
        default: "30"
        type: string
      keep_minimum_runs:
        description: "Minimum number of runs to keep per workflow"
        required: false
        default: "5"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.retain_days || '30' }}
          keep_minimum_runs: ${{ inputs.keep_minimum_runs || '5' }}

      # Tag deletion is intentionally NOT done here. Deleting refs/tags/*
      # destroys the vX.Y.Z release tags, which makes releases unpinnable and
      # breaks updater version resolution. Tags are removed individually.
