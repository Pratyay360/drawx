name: Clean Workflow Runs

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Number of days to keep runs (0 to delete all)"
        required: false
        default: "0"
        type: string
      keep_minimum_runs:
        description: "Minimum number of runs to keep per workflow"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: write
  attestations: write
  packages: write

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.retain_days || '0' }}
          keep_minimum_runs: ${{ inputs.keep_minimum_runs || '0' }}
      
      - name: Delete All Git Tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            "repos/${{ github.repository }}/git/refs/tags" \
            --jq '.[].ref' |
          while read -r ref; do
            tag="${ref#refs/tags/}"
            echo "Deleting tag: $tag"
            gh api \
              --method DELETE \
              "repos/${{ github.repository }}/git/refs/tags/$tag"
          done
