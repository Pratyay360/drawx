name: Tauri v2 Release Process
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CN_APPLICATION: "pratyay/drawx"

jobs:
  # Every push to main gets a fresh patch version so the CrabNebula release
  # never collides with an existing one. The bump is committed back to main
  # with a "[skip ci]" marker; the marker check below is a belt-and-braces
  # guard in case GitHub's skip mechanism is bypassed.
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.ref }}

      - name: Check if last commit is a release bump
        id: skip
        run: |
          if git log -1 --format='%s' | grep -qE '^chore\(release\):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Last commit is a release bump - not creating another release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-bump patch version
        id: bump
        if: steps.skip.outputs.skip == 'false'
        run: |
          VERSION="$(node scripts/bump-version.mjs)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): bump version to v$VERSION [skip ci]"
          git push origin main

  draft:
    needs: bump-version
    if: needs.bump-version.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
      - name: create draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: draft

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@main
      - uses: nubjs/setup-nub@v0

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf libxdo-dev libfuse2

      - name: build Tauri app for Windows, Linux
        if: matrix.os != 'macos-latest'
        run: |
          nub install
          nub run tauri build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Install x86_64-apple-darwin for mac and build Tauri binaries
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          nub install
          nub run tauri build --target x86_64-apple-darwin
          nub run tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: upload assets
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          path: ./src-tauri

      - name: upload build artifacts for GitHub release
        uses: actions/upload-artifact@main
        with:
          name: release-assets-${{ matrix.os }}-${{ github.run_number }}

          path: |
            src-tauri/target/release/bundle/*/*
            src-tauri/target/*/release/bundle/*/*
          if-no-files-found: ignore

  publish:
    needs: [build, bump-version]
    if: needs.bump-version.outputs.version != ''

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@main

      - name: publish release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

      - name: download all artifacts
        uses: actions/download-artifact@main
        continue-on-error: true
        with:
          path: ./release-assets
          pattern: release-assets-*
          merge-multiple: true

      - name: publish to gh releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: ./release-assets/*
          tag_name: v${{ needs.bump-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
