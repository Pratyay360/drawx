name: "flatpak"

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bundle: drawx_x86_64.flatpak
          - arch: aarch64
            bundle: drawx_aarch64.flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: flatpak/io.github.pratyay360.drawx.yml
          branch: stable
          cache-key: drawx-flatpak-${{ runner.os }}-${{ matrix.arch }}-${{ github.ref_name }}
          arch: ${{ matrix.arch }}
          verbose: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@main
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

      - name: Attach flatpak to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.bundle }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
