name: flatpak

on:
  workflow_dispatch:
  workflow_run:
    workflows: [release-goreleaser, ci]
    types:
      - completed

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

jobs:
  build-flatpak:
    name: Flatpak (x86_64)
    # Only build packages from a successful release build — never from a failed
    # or skipped one. Skipping failures avoids ~30min of wasted compute per run.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: drawx_x86_64.flatpak
          manifest-path: flatpak/io.github.pratyay360.drawx.yml
          branch: stable
          # Key on the manifest rather than the sha: the sha changes every run,
          # so a sha-keyed cache never hits and every build is fully cold.
          cache-key: drawx-flatpak-${{ runner.os }}
          arch: x86_64
          verbose: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}


      - name: Upload flatpak bundle
        uses: actions/upload-artifact@main
        with:
          name: flatpak-x86_64
          path: drawx_x86_64.flatpak

      - name: Attach flatpak to release
        # Only on version-tag pushes: attaches the bundle to that tag's
        # (GoReleaser) GitHub Release. Runs after `ci` only validate the build.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          make_latest: true
          files: drawx_x86_64.flatpak
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
