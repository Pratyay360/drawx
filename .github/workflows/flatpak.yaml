name: flatpak
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tauri v2 Release Process"]
    types: [completed]

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  CN_APPLICATION: "pratyay/drawx"

jobs:
  build-flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bundle: drawx_x86_64.flatpak

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: flatpak/io.github.pratyay360.drawx.yml
          branch: stable
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/io.github.pratyay360.drawx.yml', 'flatpak/cargo-sources.json', 'src-tauri/Cargo.lock', 'bun.lock') }}
          arch: ${{ matrix.arch }}
          verbose: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_BUNDLE_CREATE_UPDATER_ARTIFACTS: "false"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@main
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

      - name: Draft release on CrabNebula Cloud
        if: startsWith(github.ref, 'refs/tags/')
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} ${{ github.ref_name }}
          api-key: ${{ secrets.CN_API_KEY }}

      - name: Upload flatpak to CrabNebula Cloud
        if: startsWith(github.ref, 'refs/tags/')
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload --file ${{ matrix.bundle }} ${{ env.CN_APPLICATION }} ${{ github.ref_name }}
          api-key: ${{ secrets.CN_API_KEY }}

      - name: Attach flatpak to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.bundle }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
