name: flatpak
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tauri v2 Release Process"]
    types: [completed]

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  CN_APPLICATION: "pratyay/drawx"
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}


jobs:
  build-flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            bundle: drawx_x86_64.flatpak

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: flatpak/io.github.pratyay360.drawx.yml
          branch: stable
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/io.github.pratyay360.drawx.yml', 'flatpak/cargo-sources.json', 'src-tauri/Cargo.lock', 'bun.lock') }}
          arch: ${{ matrix.arch }}
          verbose: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_BUNDLE_CREATE_UPDATER_ARTIFACTS: "false"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload flatpak bundle
        uses: actions/upload-artifact@main
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

      # - name: Draft release on CrabNebula Cloud
      #   uses: crabnebula-dev/cloud-release@v0
      #   with:
      #     command: release draft ${{ env.CN_APPLICATION }} ${{ github.ref_name }}
      #     api-key: ${{ secrets.CN_API_KEY }}

      # - name: Upload flatpak to CrabNebula Cloud
      #   if: startsWith(github.ref, 'refs/tags/')
      #   uses: crabnebula-dev/cloud-release@v0
      #   with:
      #     command: release upload --file ${{ matrix.bundle }} ${{ env.CN_APPLICATION }} ${{ github.ref_name }}
      #     api-key: ${{ secrets.CN_API_KEY }}

      # The flatpak belongs to the same version as the desktop bundles, so
      # attach it to the release the Tauri workflow publishes (v<version>).
      # github.ref_name is the branch ("main") for workflow_run/workflow_dispatch
      # and would create a release for the wrong tag.
      - name: Resolve release tag
        id: release
        shell: bash
        run: echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Attach flatpak to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ matrix.bundle }}
        # The flatpak-github-actions container ships curl/jq but no gh CLI,
        # so the release is handled through the GitHub API directly.
        run: |
          set -euo pipefail

          api_url="https://api.github.com"
          upload_url="https://uploads.github.com"
          repo="$GITHUB_REPOSITORY"

          api() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          release_id() {
            api "$api_url/repos/$repo/releases/tags/$TAG" 2>/dev/null \
              | jq -r '.id // empty' || true
          }

          if [ ! -f "$BUNDLE" ]; then
            echo "no such file: $BUNDLE" >&2
            exit 1
          fi

          id="$(release_id)"
          if [ -z "$id" ]; then
            echo "no release for tag $TAG, creating a draft"
            payload="$(jq -n --arg tag "$TAG" --arg target "$GITHUB_SHA" \
              '{tag_name: $tag, name: ("drawx " + $tag), target_commitish: $target, draft: true}')"
            if ! id="$(api --request POST "$api_url/repos/$repo/releases" \
              --data "$payload" | jq -r '.id // empty')"; then
              # The other matrix job created the release first.
              id="$(release_id)"
            fi
          fi

          if [ -z "$id" ]; then
            echo "could not resolve release $TAG" >&2
            exit 1
          fi

          asset_id="$(api "$api_url/repos/$repo/releases/$id/assets" \
            | jq -r --arg name "$BUNDLE" 'first(.[] | select(.name == $name) | .id) // empty')"
          if [ -n "$asset_id" ]; then
            echo "replacing existing asset $BUNDLE ($asset_id)"
            api --request DELETE "$api_url/repos/$repo/releases/$id/assets/$asset_id" >/dev/null
          fi

          echo "uploading $BUNDLE to release $TAG"
          api --request POST "$upload_url/repos/$repo/releases/$id/assets?name=$BUNDLE" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$BUNDLE" >/dev/null
