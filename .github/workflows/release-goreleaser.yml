name: release-goreleaser

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: ""
            patch-appimage: "true"
          - os: windows-latest
            targets: ""
            patch-appimage: "false"
          - os: macos-latest
            targets: "x86_64-apple-darwin aarch64-apple-darwin"
            patch-appimage: "false"
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/tauri-build
        with:
          targets: ${{ matrix.targets }}
          patch-appimage: ${{ matrix.patch-appimage }}

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staged-bundles
          find src-tauri/target -path '*bundle*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.AppImage.zsync' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.AppImage.tar.gz' \
            -o -name '*.nsis.zip' -o -name '*.sig' \) \
            -exec cp -v {} staged-bundles/ \;
          ls -la staged-bundles

      - name: Upload bundles
        uses: actions/upload-artifact@main
        with:
          name: bundles-${{ matrix.os }}
          path: staged-bundles/
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download all bundles
        uses: actions/download-artifact@main
        with:
          pattern: bundles-*
          path: dist-bundles
          merge-multiple: true

      - name: List staged artifacts
        run: ls -laR dist-bundles

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist-bundles/*"
          allowUpdates: true
          commit: ${{ github.sha }}
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "drawx v1.0.${{ github.run_number }}"
