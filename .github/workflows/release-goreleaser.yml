name: release-goreleaser

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

# This workflow publishes the release, so it must not read from the Actions
# cache: a cache entry written by a less trusted workflow would end up in the
# published artifacts.
cache-mode: none

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: ""
            patch-appimage: "true"
          - os: windows-latest
            targets: ""
            patch-appimage: "false"
          - os: macos-latest
            targets: "x86_64-apple-darwin aarch64-apple-darwin"
            patch-appimage: "false"
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/tauri-build
        with:
          targets: ${{ matrix.targets }}
          patch-appimage: ${{ matrix.patch-appimage }}

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staged-bundles
          find src-tauri/target -path '*bundle*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.AppImage.zsync' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.AppImage.tar.gz' \
            -o -name '*.nsis.zip' -o -name '*.sig' \) \
            -exec cp -v {} staged-bundles/ \;
          ls -la staged-bundles

      - name: Upload bundles
        uses: actions/upload-artifact@main
        with:
          name: bundles-${{ matrix.os }}
          path: staged-bundles/
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    # Least privilege: this job writes the GitHub Release (contents) and mints
    # an OIDC token for keyless cosign signing (id-token). The build jobs do
    # not need id-token, so it is scoped here rather than workflow-wide.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download all bundles
        uses: actions/download-artifact@main
        with:
          pattern: bundles-*
          path: dist-bundles
          merge-multiple: true

      - name: List staged artifacts
        run: ls -laR dist-bundles

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless (Sigstore) signing: cosign mints a short-lived certificate from
      # this workflow's OIDC token, so there is no long-lived private key to
      # store. Each artifact gets a self-contained `.cosign.bundle` that we
      # attach to the release. `.sig` files are Tauri updater signatures (not
      # standalone artifacts), so we do not re-sign those.
      - name: Sign release artifacts (keyless / OIDC)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed=0
          for f in dist-bundles/*; do
            case "$f" in
              *.sig) continue ;;
            esac
            echo "Signing $f"
            cosign sign-blob \
              --yes \
              --bundle "$f.cosign.bundle" \
              "$f"
            signed=$((signed + 1))
          done
          echo "Signed $signed artifact(s)"
          ls -la dist-bundles

      # Smoke test: verify one artifact end-to-end against the OIDC identity so
      # a broken signing setup fails here instead of shipping unverifiable
      # bundles. The certificate identity is this workflow file at the ref that
      # triggered the run.
      - name: Verify a signed artifact (smoke test)
        shell: bash
        env:
          CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-goreleaser.yml@${{ github.ref }}
          CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          target="$(ls dist-bundles/*.cosign.bundle | head -n 1)"
          artifact="${target%.cosign.bundle}"
          echo "Verifying $artifact"
          cosign verify-blob \
            --bundle "$target" \
            --certificate-identity "$CERT_IDENTITY" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" \
            "$artifact"

      - name: Push to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
        # Same behaviour as the previous release action: update the release if
        # the tag already has one, otherwise create it at the built commit.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bundles/* --clobber
          else
            gh release create "$TAG" dist-bundles/* \
              --title "drawx $TAG" \
              --target "$GITHUB_SHA"
          fi
