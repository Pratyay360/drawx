name: release-goreleaser

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

# This workflow publishes the release, so it must not read from the Actions
# cache: a cache entry written by a less trusted workflow would end up in the
# published artifacts.
cache-mode: none

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            targets: ""
            patch-appimage: "true"
          - os: windows-latest
            targets: ""
            patch-appimage: "false"
          - os: macos-latest
            targets: "x86_64-apple-darwin aarch64-apple-darwin"
            patch-appimage: "false"
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/tauri-build
        with:
          targets: ${{ matrix.targets }}
          patch-appimage: ${{ matrix.patch-appimage }}

      - name: Stage bundles
        shell: bash
        run: |
          mkdir -p staged-bundles
          find src-tauri/target -path '*bundle*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.AppImage.zsync' \
            -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.AppImage.tar.gz' \
            -o -name '*.nsis.zip' -o -name '*.sig' \) \
            -exec cp -v {} staged-bundles/ \;
          ls -la staged-bundles

      - name: Upload bundles
        uses: actions/upload-artifact@main
        with:
          name: bundles-${{ matrix.os }}
          path: staged-bundles/
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download all bundles
        uses: actions/download-artifact@main
        with:
          pattern: bundles-*
          path: dist-bundles
          merge-multiple: true

      - name: List staged artifacts
        run: ls -laR dist-bundles

      - name: Push to Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.${{ github.run_number }}
        # Same behaviour as the previous release action: update the release if
        # the tag already has one, otherwise create it at the built commit.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-bundles/* --clobber
          else
            gh release create "$TAG" dist-bundles/* \
              --title "drawx $TAG" \
              --target "$GITHUB_SHA"
          fi
