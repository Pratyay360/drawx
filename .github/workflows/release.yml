name: 'Publish Release'

# Triggers on each push to the `release` branch.
on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@main
      - uses: nubjs/setup-nub@v0

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # `rpm` provides `rpmbuild`, required to build the .rpm bundle
          # (targets is "all", which already includes rpm).
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install front-end dependencies
        run: nub install

      - name: Build Tauri app
        run: cargo tauri build -- -vv

      - name: Build Flatpak (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.freedesktop.Sdk.Extension.rust-stable//23.08
          nub run build   # Tauri embeds ../dist into the binary at compile time
          flatpak-builder --repo=flatpak/repo flatpak/build flatpak/com.pmustafi.drawx.yml
          flatpak build-bundle flatpak/repo drawx.flatpak com.pmustafi.drawx

      - name: Upload bundles
        uses: actions/upload-artifact@main
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*
            drawx.flatpak
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main

      - name: Download all build artifacts
        uses: actions/download-artifact@main
        with:
          path: artifacts
          merge-multiple: true

      - name: Read version
        id: version
        run: |
          VER=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
