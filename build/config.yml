# Drawx build configuration (Wails v3).
# After editing `info`, run `wails3 task common:update:build-assets` to
# regenerate the build/ directory contents.
version: '3'

info:
  companyName: "Drawx"
  productName: "drawx"
  productIdentifier: "com.pmustafi.drawx"
  description: "Offline-first brainstorming app"
  copyright: "(c) 2026, Drawx"
  comments: "Built with Wails v3"
  version: "0.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations: []

# Other data
other:
  - name: Drawx
