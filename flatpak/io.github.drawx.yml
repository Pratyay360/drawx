id: io.github.drawx
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: drawx

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: drawx
    buildsystem: simple

    build-options:
      # For GitHub Actions CI (flatpak-github-actions) we need network to fetch pnpm + npm deps.
      # For Flathub offline builds, remove --share=network and rely on vendored sources instead:
      #   Cargo: python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
      #              src-tauri/Cargo.lock -o cargo-sources.json
      #          then: cp cargo-sources.json flatpak/cargo-sources.json
      #   pnpm:  pnpm install --frozen-lockfile; vendor node_modules manually
      #          or generate via pnpm and add flatpak/generated-sources.json
      # Then add cargo-sources.json (+ generated-sources.json when available) as extra sources
      # (see the sources section below).  Regenerate both on every lockfile bump.
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin:/run/build/drawx/bin
      env:
        CARGO_HOME: /run/build/drawx/cargo
        XDG_CACHE_HOME: /run/build/drawx/flatpak-node/cache
        COREPACK_HOME: /run/build/drawx/flatpak-node/corepack
        npm_config_cache: /run/build/drawx/flatpak-node/npm-cache


    build-commands:
      - npm install
      - npx tauri build --no-bundle
      # --- Install artifacts ---
      - install -Dm755 src-tauri/target/release/drawx /app/bin/drawx

      - install -Dm644 flatpak/io.github.drawx.desktop
        /app/share/applications/io.github.drawx.desktop

      - install -Dm644 flatpak/io.github.drawx.metainfo.xml
        /app/share/metainfo/io.github.drawx.metainfo.xml

      - install -Dm644 src-tauri/icons/32x32.png
        /app/share/icons/hicolor/32x32/apps/io.github.drawx.png
      - install -Dm644 src-tauri/icons/64x64.png
        /app/share/icons/hicolor/64x64/apps/io.github.drawx.png
      - install -Dm644 src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.drawx.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
        /app/share/icons/hicolor/256x256/apps/io.github.drawx.png

    sources:
      - type: dir
        path: ../
      # Vendored Rust crates — generated via flatpak-builder-tools/cargo.
      # For local builds this is optional when --share=network is enabled, but it
      # allows fully offline builds and is required for Flathub submission.
      # Keep the file at flatpak/cargo-sources.json (copied from ../cargo-sources.json)
      # so flatpak-builder can expand it as a list of sources.
      - cargo-sources.json
      # --- For Flathub submission, replace the `type: dir` source above with: ---
      #
      # - type: git
      #   url: https://github.com/pratyay360/drawx.git
      #   tag: v0.7.1
      #   commit: <full-commit-hash>
      #
      # Then keep the vendored offline sources below (regenerate on every lockfile bump):
      # - cargo-sources.json
      # - generated-sources.json  # when available (npm/pnpm)
      #
      # Bare filenames are interpreted by flatpak-builder as lists of sources.
