id: io.github.drawx
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: drawx

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: drawx
    buildsystem: simple

    build-options:
      # Uncomment the line below for local `flatpak-builder` testing (requires network).
      # For Flathub offline builds, vendored sources must be pre-generated instead:
      #   Cargo: python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
      #              src-tauri/Cargo.lock -o cargo-sources.json
      #   Bun:   flatpak-builder-tools/node/flatpak-node-generator bun bun.lock \
      #              -o flatpak/generated-sources.json
      # Then add cargo-sources.json and generated-sources.json as extra sources
      # (see the sources section below).  Regenerate both on every lockfile bump.
      #
      # build-args:
      #   - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
      env:
        CARGO_HOME: /run/build/drawx/cargo
        XDG_CACHE_HOME: /run/build/drawx/flatpak-node/cache
        npm_config_cache: /run/build/drawx/flatpak-node/npm-cache
        BUN_INSTALL: /run/build/drawx/bun

    build-commands:
      # --- Cargo vendor setup ---
      - |
        if [ -f cargo/config ]; then
          mkdir -p .cargo
          cp -f cargo/config .cargo/config.toml
          export CARGO_NET_OFFLINE=true
          echo "Using vendored cargo (offline)"
        else
          echo "No cargo/vendor found — network access required (enable --share=network)"
        fi

      # --- Bun install + build ---
      # Offline path: flatpak-node-generator pre-populates the cache at
      # $XDG_CACHE_HOME so `bun install --frozen-lockfile` works without network.
      # Local/network path: downloads bun on the fly when --share=network is set.
      - |
        if command -v bun &>/dev/null; then
          echo "bun found on PATH: $(bun --version)"
        elif [ -x "$BUN_INSTALL/bin/bun" ]; then
          export PATH="$BUN_INSTALL/bin:$PATH"
          echo "bun found at BUN_INSTALL: $(bun --version)"
        else
          echo "bun not found — downloading (requires --share=network)"
          curl -fsSL https://bun.sh/install | bash -s -- --no-profile
          export PATH="$BUN_INSTALL/bin:$PATH"
        fi
        bun install --frozen-lockfile
        bun run tauri build --no-bundle

      # --- Install artifacts ---
      - install -Dm755 src-tauri/target/release/drawx /app/bin/drawx

      - install -Dm644 flatpak/io.github.drawx.desktop
        /app/share/applications/io.github.drawx.desktop

      - install -Dm644 flatpak/io.github.drawx.metainfo.xml
        /app/share/metainfo/io.github.drawx.metainfo.xml

      - install -Dm644 src-tauri/icons/32x32.png
        /app/share/icons/hicolor/32x32/apps/io.github.drawx.png
      - install -Dm644 src-tauri/icons/64x64.png
        /app/share/icons/hicolor/64x64/apps/io.github.drawx.png
      - install -Dm644 src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.drawx.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
        /app/share/icons/hicolor/256x256/apps/io.github.drawx.png

    sources:
      - type: dir
        path: ../
      # --- For Flathub submission, replace the `type: dir` source above with: ---
      #
      # - type: git
      #   url: https://github.com/pratyay360/drawx.git
      #   tag: v0.6.9
      #   commit: <full-commit-hash>
      #
      # Then add the vendored offline sources (generated per the instructions above):
      # - cargo-sources.json
      # - generated-sources.json
      #
      # Bare filenames are interpreted by flatpak-builder as lists of sources.
      # Regenerate both files on every Cargo.lock / bun.lock bump.
