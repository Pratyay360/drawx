id: io.github.pratyay360.drawx
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

command: drawx

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --device=dri

modules:
  - name: drawx
    buildsystem: simple

    build-options:
      # Offline build: Node deps are vendored via flatpak/generated-sources.json
      # (regenerate on every pnpm-lock.yaml bump with:
      #  python3 -m flatpak_node_generator pnpm pnpm-lock.yaml \
      #    -o flatpak/generated-sources.json
      #  run from flatpak-builder-tools/node/).
      # Cargo deps are vendored via flatpak/cargo-sources.json.
      # Do NOT add network access here; Flathub builds are offline.

      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin:/run/build/drawx/bin
      env:
        CARGO_HOME: /run/build/drawx/cargo
        XDG_CACHE_HOME: /run/build/drawx/flatpak-node/cache
        npm_config_cache: /run/build/drawx/flatpak-node/npm-cache


    build-commands:
      # pnpm comes from the node24 SDK extension on PATH (see append-path).
      # Do NOT `npm install -g pnpm` or `corepack enable` here: the SDK is
      # read-only and the build sandbox has no network (EAI_AGAIN).
      # generated-sources.json already populated flatpak-node/pnpm-store and
      # wrote store-dir to .npmrc, so install fully offline.
      - pnpm install --offline --frozen-lockfile
      - pnpm exec tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/drawx /app/bin/drawx

      - install -Dm644 flatpak/io.github.pratyay360.drawx.desktop
        /app/share/applications/io.github.pratyay360.drawx.desktop

      - install -Dm644 flatpak/io.github.pratyay360.drawx.metainfo.xml
        /app/share/metainfo/io.github.pratyay360.drawx.metainfo.xml

      - install -Dm644 src-tauri/icons/32x32.png
        /app/share/icons/hicolor/32x32/apps/io.github.pratyay360.drawx.png
      - install -Dm644 src-tauri/icons/64x64.png
        /app/share/icons/hicolor/64x64/apps/io.github.pratyay360.drawx.png
      - install -Dm644 src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.pratyay360.drawx.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
        /app/share/icons/hicolor/256x256/apps/io.github.pratyay360.drawx.png

    sources:

      - type: git
        url: https://github.com/pratyay360/drawx.git
        branch: main
      #
      - cargo-sources.json
      - generated-sources.json
      #
      # Bare filenames are interpreted by flatpak-builder as lists of sources.
      # Regenerate both on every lockfile bump:
      #   Cargo: src-tauri/Cargo.lock -> flatpak/cargo-sources.json
      #   Node:  pnpm-lock.yaml -> flatpak/generated-sources.json
