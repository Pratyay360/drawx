[tools]
rust = "latest"
cargo-make = "latest"
rust-analyzer = "latest"
node = "24"
biome = "latest"
go = "latest"
sops = "latest"
"cargo:tauri-cli" = "latest"
goreleaser = "latest"
sentry-cli = "latest"
bun = "1.4.1"

[env]
SOPS_AGE_RECIPIENTS = "age1a9p2k3u40mvdntpad4ga7akvnnqqwm6eskfr2yxkgq3u9lp7jfns2wgqty,age155th0ptdjf3gkp7pmzqcepe9kec9n3w32l87czf29fda4a2gj49ql0pg8a"
_.file = { path = ".env" }

[settings]
auto_install = true

[tasks.update]
description = "Update JS dependencies"
run = ["bun install", "bun update"]

[tasks.dev]
description = "Start Vite dev server"
run = "bun run dev"

[tasks.build]
description = "Build frontend"
run = "bun run build"

[tasks."build:frontend"]
description = "Alias for build (frontend only)"
run = "bun run build"

[tasks.typecheck]
description = "Run TypeScript typecheck (no emit)"
run = "bun run typecheck"

[tasks.lint]
description = "Lint with Biome"
run = "biome lint ."

[tasks."lint:fix"]
description = "Lint and auto-fix with Biome"
run = "biome lint --fix ."

[tasks.format]
description = "Format with Biome"
run = "biome format --write ."

[tasks."format:check"]
description = "Check formatting with Biome (no write)"
run = "biome format ."

[tasks.check]
description = "Run lint + typecheck"
depends = ["lint", "typecheck"]

[tasks."check:fix"]
description = "Run lint:fix + format"
run = [{ task = "lint:fix" }, { task = "format" }]

# ── Tauri ────────────────────────────────────────────────────────
[tasks.tauri]
description = "Run tauri CLI (pass-through args)"
run = '''#!/usr/bin/env bash
bun run tauri "$@"
'''

[tasks."tauri:dev"]
description = "Run Tauri in dev mode"
run = "bun run tauri dev"

[tasks."tauri:build"]
description = "Build Tauri app (release nubdle)"
run = "bun run tauri:build"

[tasks."build:tauri"]
description = "Alias for tauri:build"
run = "bun run tauri:build"

[tasks.astryx]
description = "Run Astryx CLI (pass-through args)"
run = '''#!/usr/bin/env bash
bun run astryx "$@"
'''

[tasks."astryx:build"]
description = "Run astryx build (pass args)"
run = '''#!/usr/bin/env bash
bun run astryx build "$@"
'''

[tasks."astryx:component"]
description = "Show Astryx component docs"
run = '''#!/usr/bin/env bash
bun run astryx component "$@"
'''

[tasks."astryx:template"]
description = "Scaffold Astryx template"
run = '''#!/usr/bin/env bash
bun run astryx template "$@"
'''

[tasks.encrypt]
description = "Encrypt .env with sops"
run = "sops -e -i .env && mv .env .env.example"

[tasks.decrypt]
description = "Decrypt .env.example with sops"
run = "mv .env.example .env && sops -d -i .env"

[tasks.static]
description = "Deploy docs via surge"
run = "surgecli deploy docs/ drawx-docs.surge.sh"

# ── CI / Housekeeping ────────────────────────────────────────────
[tasks.ci]
description = "CI: lint + build frontend"
depends = ["lint", "build"]

[tasks."ci:full"]
description = "CI full: lint + tauri build"
depends = ["lint", "tauri:build"]

[tasks."flatpak:sources"]
description = "Regenerate Flatpak Node sources from bun.lock"
run = "bun run flatpak:sources"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf dist src-tauri/target node_modules/.vite"

[tasks.deps]
description = "Install mise tools + JS deps"
run = ["mise install", "bun install"]
